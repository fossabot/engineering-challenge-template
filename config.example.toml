# Kalshi collector example. Credentials may also come from KALSHI_API_KEY_ID,
# KALSHI_PRIVATE_KEY_PATH, or KALSHI_PRIVATE_KEY_PEM.
exchange = "kalshi"

[kalshi]
# Production is the built-in default because the challenge targets live
# markets. Use "demo" with demo credentials for a simulated exchange.
environment = "production"
key_id = ""
# private_key_path = "/absolute/path/to/kalshi-private-key.pem"
batch_size = 100
discovery_page_size = 1000
request_timeout_secs = 20
discovery_page_delay_ms = 50

[collector]
# 0 derives the shard count from the initial symbol count and the soft socket
# capacity below. A non-zero value is fixed for the run.
shards = 0
replicas = 2
max_symbols_per_socket = 5000
max_shards = 64
snapshot_interval_secs = 60
discovery_interval_secs = 30
reconnect_after_secs = 1800
connection_idle_timeout_secs = 45
stale_probe_after_secs = 120
probe_interval_secs = 30
max_probes = 3
final_snapshots = true
writer_queue = 16384
flush_interval_secs = 1
max_markets = 0
duration_secs = 0
writer_send_timeout_secs = 30

[network]
# Transport controls for every websocket connection. TCP_NODELAY is enabled by
# default because order-book frames are small and latency-sensitive. Race
# several full handshakes with connect_race > 1 and keep the first success.
# source_port is a base: connection shard*256+replica binds base + that
# ordinal, so parallel connections never collide; a fixed port cannot be
# combined with racing.
tcp_nodelay = true
# source_ip = "192.0.2.10"
# source_port = 40000
connect_race = 1
# Deadline for one full connection attempt (DNS, TCP, TLS, websocket upgrade,
# including every raced candidate).
connect_timeout_secs = 30

[output]
path = "captures/kalshi.sbe"
# Matches the template reader's default. Periodic flushes write only encoded
# bytes; the final chunk is padded on close.
chunk_size = 67108864
metadata_path = "captures/kalshi-markets.json"
report_path = "captures/kalshi-report.json"
sync_on_close = true

[metrics]
listen = "127.0.0.1:9090"
